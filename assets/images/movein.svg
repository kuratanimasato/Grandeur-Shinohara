<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <!-- 背景 -->
  <rect width="460" height="300" fill="#007a33" rx="8"/>
  <rect x="10" y="10" width="440" height="280" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" rx="6"/>
  
  <!-- タイトル（見出しのみ） -->
  <text x="230" y="85" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">審査後、即入居OK！</text>
  
  <!-- イラストエリア -->
  <g transform="translate(130, 125)">
    <!-- 時計 -->
    <circle cx="35" cy="40" r="22" fill="#fff" stroke="#333" stroke-width="3"/>
    <polyline points="35,25 35,40 46,40" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 人物＆PASS書類 -->
    <rect x="80" y="20" width="40" height="52" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <path d="M 88 32 L 112 32 M 88 42 L 105 42" stroke="#bdc3c7" stroke-width="2"/>
    <path d="M 86 54 L 93 60 L 106 48" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="65" font-size="8" fill="#27ae60" font-weight="bold">PASS</text>

    <!-- 鍵受け渡し -->
    <path d="M 135 55 L 170 55 M 155 55 L 155 62 M 163 55 L 163 62" stroke="#333" stroke-width="3"/>
    <circle cx="130" cy="55" r="7" fill="none" stroke="#333" stroke-width="3"/>
  </g>
</svg>
