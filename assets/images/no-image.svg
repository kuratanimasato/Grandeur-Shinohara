<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f0f2f5" />

  <!-- 中央のグループ -->
  <g transform="translate(400, 280)" text-anchor="middle">
    <!-- 画像アイコン（枠） -->
    <rect x="-60" y="-70" width="120" height="90" rx="8" ry="8" fill="none" stroke="#b0b8c1" stroke-width="6" />

    <!-- 画像アイコン（山の形） -->
    <path d="M-40 10 L-15 -15 L10 10 L35 -5 L50 20 L-40 20 Z" fill="#b0b8c1" opacity="0.8" />

    <!-- 画像アイコン（太陽の円） -->
    <circle cx="25" cy="-35" r="10" fill="#b0b8c1" opacity="0.8" />

    <!-- テキスト：NO IMAGE -->
    <text x="0" y="70" font-family="YuGothic, 游ゴシック, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" font-weight="bold" fill="#6c757d" letter-spacing="2">NO IMAGE</text>
  </g>
</svg>
