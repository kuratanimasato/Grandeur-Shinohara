<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <!-- 背景 -->
  <rect width="460" height="300" fill="#007a33" rx="8"/>
  <rect x="10" y="10" width="440" height="280" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" rx="6"/>
  
  <!-- タイトル（見出しのみ） -->
  <text x="230" y="70" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="900" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">敷金礼金0円</text>
  <text x="230" y="110" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif">＋ フリーレント！</text>
  
  <!-- イラストエリア -->
  <g transform="translate(140, 140)">
    <!-- 鍵渡しの手 -->
    <path d="M 10 35 C 30 35, 45 25, 60 25 L 75 25 C 75 25, 70 40, 50 45 Z" fill="#fff" stroke="#333" stroke-width="3"/>
    <circle cx="85" cy="25" r="8" fill="none" stroke="#333" stroke-width="3"/>
    <path d="M 93 25 L 115 25 M 103 25 L 103 30 M 110 25 L 110 30" stroke="#333" stroke-width="3"/>
    
    <!-- コインの山 -->
    <ellipse cx="60" cy="75" rx="18" ry="6" fill="#f4d03f" stroke="#333" stroke-width="2"/>
    <ellipse cx="60" cy="70" rx="18" ry="6" fill="#f4d03f" stroke="#333" stroke-width="2"/>
    <ellipse cx="60" cy="65" rx="18" ry="6" fill="#f4d03f" stroke="#333" stroke-width="2"/>
    
    <!-- お札・袋（¥0） -->
    <rect x="100" y="50" width="45" height="28" rx="3" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <circle cx="122.5" cy="64" r="8" fill="#e8f8f5" stroke="#333" stroke-width="1.5"/>
    <text x="122.5" y="68" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">¥0</text>
    
    <path d="M 155 52 C 155 42, 175 42, 175 52 L 180 75 C 180 83, 150 83, 150 75 Z" fill="#edbb99" stroke="#333" stroke-width="2"/>
    <text x="165" y="69" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">¥0</text>
